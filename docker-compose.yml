services:
  postgres:
    image: postgres:16-alpine
    container_name: vyborok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vyborok
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vyborok-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: vyborok-nats
    restart: unless-stopped
    ports:
      - "4222:4222"   # клиентский порт
      - "8222:8222"   # мониторинг
    command: ["-js", "-m", "8222"]  # JetStream + мониторинг
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  redis-data:
  nats-data: