syntax = "proto3";

package vyborok;
option go_package = "github.com/VT0x00/vyborok/http/proto;pb";

// import "tag/tag.proto";
import "api/annotations.proto";
import "openapiv3/annotations.proto";
// import "google/protobuf/wrappers.proto";

service Vyborok {
    rpc Health(HealthReq) returns (HealthRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "Health";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { get: "/health"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc Register(RegisterReq) returns (RegisterRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "Register";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { post: "/auth/register"; body: "*"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc Login(LoginReq) returns (LoginRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "Login";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { post: "/auth/login"; body: "*"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc GetMe(GetMeReq) returns (ProfileRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "GetMe";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { get: "/auth/me"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc Refresh(RefreshReq) returns (LoginRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "Refresh";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { post: "/auth/refresh"; body: "*"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc UpdateProfile(UpdateProfileReq) returns (ProfileRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "UpdateProfile";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { put: "/user/profile"; body: "*"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc GetProfile(GetProfileReq) returns (ProfileRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "GetProfile";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { get: "/user/{username}"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc CreatePoll(CreatePollReq) returns (PollRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "CreatePoll";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { post: "/polls"; body: "*"; };
        option (micro.api.micro_method) = { timeout: "5s"; };
    }

    rpc GetPoll(GetPollReq) returns (PollRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "GetPoll";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { get: "/polls/{id}"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc ListPolls(ListPollsReq) returns (ListPollsRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "ListPolls";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { get: "/polls"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc UpdatePoll(UpdatePollReq) returns (PollRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "UpdatePoll";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { put: "/polls/{id}"; body: "*"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc DeletePoll(DeletePollReq) returns (DeletePollRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "DeletePoll";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { delete: "/polls/{id}"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }

    rpc ClosePoll(ClosePollReq) returns (PollRsp) {
        option (micro.openapiv3.openapiv3_operation) = {
            operation_id: "ClosePoll";
            responses: { default: { reference: { _ref: ".vyborok.ErrorRsp"; }; }; };
        };
        option (micro.api.http) = { post: "/polls/{id}/close"; };
        option (micro.api.micro_method) = { timeout: "1s"; };
    }
}

message HealthReq {}

message HealthRsp {
    string status = 1;
}

message RegisterReq {
    string email     = 1;
    string password  = 2;
    string username  = 3;
    string first_name = 4;
    string last_name  = 5;
}

message RegisterRsp {
    string access_token  = 1;
    string refresh_token = 2;
    UserProfile profile  = 3;
}

message LoginReq {
    string email    = 1;
    string password = 2;
}

message LoginRsp {
    string access_token  = 1;
    string refresh_token = 2;
    UserProfile profile  = 3;
}

message UserProfile {
    string id = 1;
    string username = 2;
    string email = 3;
    string first_name = 4;
    string last_name = 5;
    string bio = 6;
    repeated string links = 7;
    string avatar_url = 8;
    bool is_private = 9;
    repeated string public_fields = 10;
}

message GetMeReq {}

message ProfileRsp {
    UserProfile profile = 1;
    repeated PollCard polls = 2;
    bool profile_hidden = 3;
}

message RefreshReq {
    string refresh_token = 1;
}

message UpdateProfileReq {
    string username = 1;
    string first_name = 2;
    string last_name = 3;
    string bio = 4;
    repeated string links = 5;
    string avatar_url = 6;
    bool is_private = 7;
    bool is_private_set = 8;
    repeated string public_fields = 9;
    bool public_fields_set = 10;
}

message GetProfileReq {
    string username = 1;
}

message PollRsp {
    Poll poll = 1;
}

message Poll {
    string id          = 1;
    string user_id     = 2;
    string title       = 3;
    string description = 4;
    // status: "active" | "closed"
    string status      = 5;
    bool   anonymous   = 6;
    repeated Question questions = 7;
    string created_at  = 8; // RFC3339
    string updated_at  = 9; // RFC3339
}

message Question {
    string id          = 1;
    string type        = 2; // "single" | "multiple" | "scale" | "text"
    string title       = 3;
    string description = 4;
    int32  position    = 5;
    // scale_min/scale_max - only for type="scale".
    int32  scale_min   = 6;
    int32  scale_max   = 7;
    // text_max_length - only for type="text".
    int32  text_max_length = 8;
    // options - only for type="single"|"multiple".
    repeated Option options = 9;
}

message Option {
    string id       = 1;
    string text     = 2;
    int32  position = 3;
}

message CreatePollReq {
    string title       = 1;
    string description = 2;
    bool   anonymous   = 3;
    repeated CreateQuestionReq questions = 4;
}

message CreateQuestionReq {
    string type        = 1;
    string title       = 2;
    string description = 3;
    int32  scale_min   = 4;
    int32  scale_max   = 5;
    int32  text_max_length = 6;
    repeated CreateOptionReq options = 7;
}

message CreateOptionReq {
    string text = 1;
}

message GetPollReq {
    string id = 1; // path param
}

message ListPollsReq {
    // limit: 0 → default 20, max 100.
    int32 limit  = 1;
    // offset: 0 → first page.
    int32 offset = 2;
}

message ListPollsRsp {
    repeated PollCard polls = 1;
}

message PollCard {
    string id          = 1;
    string title       = 2;
    string description = 3;
    string status      = 4;
    bool   anonymous   = 5;
    int32  question_count = 6;
    string created_at  = 7; // RFC3339
}

message UpdatePollReq {
    string id          = 1; // path param
    string title       = 2;
    string description = 3;
    bool   anonymous   = 4;
    bool   anonymous_set = 5;
}

message DeletePollReq {
    string id = 1; // path param
}

message DeletePollRsp {}

message ClosePollReq {
    string id = 1; // path param
}

message ErrorRsp {
    string msg = 1;
}